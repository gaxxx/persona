services:
  persona:
    build: .
    container_name: persona
    # All of .env is loaded into the container (Telegram, API/model provider,
    # Voyage, TZ, …) — add a key to .env and it's available here with no edit.
    # NOTE: .env must NOT contain a host-only PATH line; env_file would expand it
    # to the host's PATH (macOS dirs that don't exist in the Linux container).
    # Host PATH for bun lives in watchdog.sh / resume.sh instead, not .env.
    env_file: .env
    # environment: overrides env_file for the same key — used here only for vars
    # that must differ from .env (VAULT_PATH) or aren't in .env (locale), plus a
    # ${VAR:?} guard that fails compose with a clear message if setup.sh hasn't run.
    environment:
      # Inside the container the vault is always /vault, never the host path.
      - VAULT_PATH=/vault
      # UTF-8 locale so tmux/bash render Chinese (and any non-ASCII) correctly.
      # C.UTF-8 is installed in the base image; LC_ALL pins it past inheriting POSIX.
      - LANG=C.UTF-8
      - LC_ALL=C.UTF-8
      - TZ=${TZ:-America/New_York}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:?run ./setup.sh first}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:?run ./setup.sh first}
    volumes:
      # Repo (read-write - assistant edits CLAUDE.md, conversations log, etc.)
      - .:/workspace
      # Obsidian vault — host path from .env (setup.sh sets it as absolute)
      - ${VAULT_PATH:?run ./setup.sh first}:/vault
      # Persistent npm cache (gmail MCP via npx - auth state under here)
      - persona-npm:/home/bun/.npm
    stdin_open: true
    tty: true
    restart: unless-stopped

volumes:
  persona-npm:

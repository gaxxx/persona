services:
  persona:
    build: .
    container_name: persona
    # No env_file: — Compose auto-reads `.env` from cwd for ${VAR} substitution
    # below. If .env is missing, all defaults below kick in. Daemons will
    # fail loudly at runtime if TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID are empty.
    environment:
      - TZ=${TZ:-America/New_York}
      # Inside the container, the vault is always at /vault — the host path
      # below (${VAULT_PATH:-./Obsidian}) is the bind-mount source.
      - VAULT_PATH=/vault
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - TELEGRAM_CHAT_IDS=${TELEGRAM_CHAT_IDS:-}
    volumes:
      # Repo (read-write - assistant edits CLAUDE.md, conversations log, etc.)
      - .:/workspace
      # Obsidian vault - default ./Obsidian if .env is missing or VAULT_PATH unset
      - ${VAULT_PATH:-./Obsidian}:/vault
      # Persistent npm cache (gmail MCP via npx - auth state under here)
      - persona-npm:/home/bun/.npm
    stdin_open: true
    tty: true
    restart: unless-stopped

volumes:
  persona-npm:

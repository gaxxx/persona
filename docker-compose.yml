services:
  persona:
    build: .
    container_name: persona
    # No env_file — Compose auto-reads .env from cwd for ${VAR} substitution.
    # setup.sh is the canonical entry point and guarantees .env is populated.
    # The ${VAR:?msg} syntax fails compose with a clear message if you try to
    # bypass setup.sh.
    environment:
      - TZ=${TZ:-America/New_York}
      # Inside the container the vault is always /vault.
      - VAULT_PATH=/vault
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:?run ./setup.sh first}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:?run ./setup.sh first}
      - TELEGRAM_CHAT_IDS=${TELEGRAM_CHAT_IDS:-}
    volumes:
      # Repo (read-write - assistant edits CLAUDE.md, conversations log, etc.)
      - .:/workspace
      # Obsidian vault — host path from .env (setup.sh sets it as absolute)
      - ${VAULT_PATH:?run ./setup.sh first}:/vault
      # Persistent npm cache (gmail MCP via npx - auth state under here)
      - persona-npm:/home/bun/.npm
    stdin_open: true
    tty: true
    restart: unless-stopped

volumes:
  persona-npm:
